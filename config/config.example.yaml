# tossmon 설정 예시 — 실제 사용 시 config/config.yaml 로 복사 (config.yaml은 gitignore)
# 모든 키는 tossmon/config.py 의 Config dataclass 와 1:1. 임의 키 추가 금지 (ask 필요).

api:
  base_url: "http://127.0.0.1:8899"   # mock. 라이브 리스 보유 시에만 https://openapi.tossinvest.com
  live: false                          # true = TokenManager 실발급 허용 (라이브 리스 보유 워커만)
  keys_path: "api_keys"                # client_id/secret 파일 (커밋 금지)
  token_state_path: "data/token_state.json"
  timeout_s: 10.0
  # rate limit 공시 한도 대비 사용 상한.
  # 서버 계약은 "그룹마다, 벽시계 초에 정렬된 **고정 1초 창**, 창당 limit 개" 다 (docs/06 §9-4 실측).
  # limiter 가 그 창을 하드캡으로 지키므로 이 값은 **예산 여유**일 뿐 안전장치가 아니다.
  # 안전 상한은 0.87 = 1/1.15 (docs/06 §9-8: window_cap / WINDOW_HORIZON_S).
  # 2026-08-04 W4 결정: 0.7 -> **0.85**. MARKET_DATA 7.0 -> 8.5 req/s (+21%).
  #
  # 0.87 이 아니라 0.85 인 이유: 0.87 은 측정된 **상한**이고, 상한에 걸터앉으면 측정오차와
  # 서버 변동에 남는 것이 없다. 0.85 는 약 2% 여유를 두고도 +21% 를 가져간다.
  #
  # ⚠️ 이 값이 안전한 것은 버스트가 작아서가 아니라 **limiter 의 슬라이딩 하드캡이 창을
  # 지키기 때문**이다 (W1 d6b47f1). 하드캡이 없던 시절의 상한은 1/(1+BURST_FRACTION)
  # = 0.769 였고 0.85 는 최악의 초에 11.05 로 한도 10 을 깼다. 하드캡이 빠지면
  # `budget.check_usage_ratio()` 가 기동 시 이 값을 도로 막는다.
  usage_ratio: 0.85

limits:                                # req/s (docs/01 §2, 전 그룹 헤더 실측 일치 — docs/06 §9-9)
  AUTH: 5
  STOCK: 5
  MARKET_DATA: 10
  MARKET_DATA_CHART: 5
  RANKING: 5
  MARKET_INFO: 3

store:
  db_path: "data/tossmon.db"
  archive_dir: "data/archive"

universe:
  price_min_usd: "0.10"
  price_max_usd: "20.00"
  mcap_min_usd: "10000000"
  mcap_max_usd: "300000000"
  tier1_max: 1500
  tier2_max: 300
  # tier3_max 는 임의 숫자가 아니라 MARKET_DATA 예산에서 역산된 값이다 (아래 polling 주석 참조).
  # 2026-08-04: 20 -> 10. 폭을 줄여 **호가 밀도**를 샀다 (아래 tier3_orderbook_s 참조).
  tier3_max: 10

detector:
  event_window_min: 30
  event_ret_min: 0.15
  event_day_ret_min: 0.30
  event_rvol_min: 3.0
  promote_hysteresis_s: 120

polling:
  tier1_sweep_s: 45
  # 90s 는 CHART 예산 여유가 4.8% 뿐이라(300/90=3.33 vs 3.5) 승격 직후 백필이 겹치면
  # BudgetGuard 가 tier2 를 스스로 줄인다. 110s 로 늦춰 여유 22% 를 확보한다 — 종목 수를
  # 줄이는 대신 주기를 늦춘 이유는, tier2 의 질문이 "이 종목이 달아오르는가"라는 분 단위
  # 판단이고 초 단위 지연이 중요한 곳은 tier3(/trades 4s)이기 때문이다. 커버리지가 더 값지다.
  tier2_candle_s: 110
  # A2 §1: 호가는 1레벨뿐이라 정보량이 적고, 테이프(/trades)가 최상위 피처다.
  # 두 주기를 분리해 테이프를 조밀하게, 호가를 성기게 본다. (구 tier3_micro_s 를 대체)
  tier3_trades_s: 4        # A2 권장 3~5s
  # 2026-08-04: 16s -> 4s. A2 의 15~20s 권장을 의도적으로 벗어난다 — 그 권장은 호가를
  # "참고 지표"로 볼 때의 값이고, 우리는 체결의 **매수/매도 방향 판정**에 호가를 쓴다.
  # 16s 에서는 호가 1건 뒤로 체결이 109건 지나가 108건이 낡은 호가로 판정됐다. 4s 면
  # 호가당 체결 약 4건이라 방향 판정이 사실상 해결된다. 그 재원이 tier3_max 20 -> 10 이다.
  tier3_orderbook_s: 4
  ranking_snap_s: 12
#
# ⚠️ 아래 산식은 전부 **초당 평균**이다. 서버는 평균이 아니라 **매 1초**를 센다 (docs/06 §9-4).
# 평균 6.42 ≤ 7.0 이어도 어느 한 초에 11발이 몰리면 그 초는 429다. 평균을 지키는 것은
# 예산의 일이고, 매 초를 지키는 것은 `api/limiter.py` 의 하드캡이 맡는다 — 둘 다 필요하다.
# (`collector/budget.py` 는 60초 평균으로 재므로 1초 초과를 구조적으로 볼 수 없다: docs/06 §9-9.)
#
# MARKET_DATA 예산 검증 (한도 10 req/s × usage_ratio 0.85 = 8.5 req/s):
#   tier1 스윕   1500종목 / 배치200 / 45s            = 0.18 req/s
#   tier3 trades tier3_max / tier3_trades_s          = 10/4  = 2.50
#   tier3 호가   tier3_max / tier3_orderbook_s       = 10/4  = 2.50
#   합계 5.18 req/s
#
# 통과 기준은 8.5 가 아니라 **두 천장**이다 (budget.py):
#   축소 천장 shrink_ceiling = 8.5 × 0.95        = 8.08  ← 넘으면 가드가 tier3 를 줄인다
#   계획 천장 plan_ceiling   = 8.5 × (0.95-0.10) = 7.23  ← 계획은 여기 아래여야 한다
#   5.18 ≤ 7.23 ✅  여유 +2.05 req/s (0.7 시절에는 +0.77 이었다)
# 이 여유는 계획에 없는 호출의 몫이다: 재시도, 승격 직후 백필, 세션 전환 후 베이스라인
# 갱신, tier2 호가(의도적으로 계획 밖, 최대 0.5 req/s). 예전 설정(20종목/16s = 6.43)은
# 6.65 를 0.22 차이로 밑돌아 **여유가 음수**였고, 그래서 개장 버스트마다 축소가 걸렸다.
#
# 20종목을 유지한 채 호가만 4s 로 당기는 것은 불가능하다 (10.18 req/s). 20종목 + 8s 도
# 7.68 로 즉시 축소다. 폭과 밀도는 같은 예산을 나눠 쓴다 — 늘리려면 다른 쪽을 줄여야 한다.
#
# RANKING 예산 (5 × 0.85 = 4.25 req/s):
#   랭킹 스냅  ranking_types / ranking_snap_s     = 3/12 = 0.25 req/s
#   계획 천장 4.25 × (0.95-0.10) = 3.61 → 여유 +3.36. 사실상 고정이라 압박이 없다.
# 2026-08-07 사용자 결정(D-11)으로 2종 → **3종** (`TOP_GAINERS`, duration=1d). 타입 하나가
# 1/12 = 0.083 req/s 다. 종류 수는 `collector/loops.RANKING_TYPES` 를 세어 넘어오므로
# (`refresh_plan`), 이 줄은 사람이 읽는 산식이고 계산의 출처가 아니다.
# ⚠️ 랭킹은 **축소 대상이 아니다** — 과거 조회가 불가능한 유일한 데이터라 넘치면 가드가
# 자동 조정하지 않고 경보만 낸다. 그래서 여기서 미리 맞춰두는 것이 유일한 방어다.
#
# MARKET_DATA_CHART 예산 (5 × 0.85 = 4.25 req/s):
#   tier2 1분봉  tier2_max / tier2_candle_s = 300/110 = 2.73 req/s
#   계획 천장 4.25 × 0.85 = 3.61 → 여유 +0.89 (0.7 시절 +0.25)
# 이 여유는 **승격 직후 백필**을 위한 것이다. 승격된 종목은 과거 봉을 즉시 채워야
# 베이스라인·RVOL 을 계산할 수 있어 순간적으로 CHART 호출이 몰린다 (W4 발견).
# 여유가 5% 수준이면 백필이 겹칠 때마다 가드가 tier2 를 줄여 커버리지가 조용히 무너진다.
#
# BudgetGuard 는 두 산식을 런타임에 재검증하고 초과 예측 시 해당 티어를 자동 축소해야 한다.
