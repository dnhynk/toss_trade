# ops/ 스크립트 전용 설정 예시 — 실사용 시 ops/ops_config.yaml 로 복사.
# tossmon/config.py 의 Config(감시 파라미터)와는 별개다 — 여기는 경로/임계값만 다룬다.
# 시크릿이 없으므로 이 파일 자체는 커밋해도 안전하다 (api_keys 만 절대 커밋 금지).

db_path: "data/tossmon.db"
log_dir: "data/logs"
state_dir: "data/ops_state"
archive_dir: "data/archive"

# collector 실행 커맨드. W4 머지(main 1f8d1ab) 로 실제 엔트리포인트가 확정됐다:
# tossmon/collector/__main__.py → `python -m tossmon.collector`.
# --symbols 를 주지 않으면 워치리스트는 랭킹 출현 종목으로 스스로 채워진다.
collector_cmd: ["python", "-m", "tossmon.collector", "--config", "config/config.yaml"]

disk:
  warn_free_gb: 5.0
  critical_free_gb: 2.0

# DB 최신 행이 이보다 오래되면 경고/위험 (세션 중인지는 운영자가 docs/08 시간표로 판단)
stale_minutes_warn: 5
stale_minutes_critical: 15

log_retention_days: 14
log_max_bytes: 20000000   # 20MB — 초과 시 회전

daily_health:
  # 결번된 아침 리포트를 며칠까지 거슬러 채울지 (ops/daily_health.py 의 따라잡기 상한).
  # 기본 7일 근거: 사후 재구성이 읽는 collector.log 의 회전 보존이 log_retention_days(14)일
  # 이라 그 절반이면 [체결 tape gap] 절이 아직 살아 있고, 1일 상한은 주말을 낀 다일 정전을
  # 못 넘긴다. 이 값을 늘리면 오래된 결번 하나가 정시 리포트를 그만큼 늦춘다(하루당 실측
  # 재구성 비용이 붙는다). 상한 밖이라 포기한 날은 stdout 에 명시된다 — 조용히 잘리지 않는다.
  catchup_days: 7

# ops/dispatch_sweep.py 가 훑을 오케스트레이션 Run id (`orca orchestration run-list` 로 확인).
# 시크릿이 아니라 로컬 런타임 식별자다. 비워두면 도구는 --run 을 요구하고 멈춘다 —
# 빈 값을 "훑을 것 없음"으로 읽지 않는다.
orchestration_run_id: "run_92948a1f80a5"

restart:
  max_restarts_per_window: 5   # restart_window_s 안에 이 횟수 넘게 죽으면 폭주로 간주, 재시도 중단
  restart_window_s: 600
  backoff_base_s: 2.0
  backoff_cap_s: 300.0
