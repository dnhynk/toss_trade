# ops/ 스크립트 전용 설정 예시 — 실사용 시 ops/ops_config.yaml 로 복사.
# tossmon/config.py 의 Config(감시 파라미터)와는 별개다 — 여기는 경로/임계값만 다룬다.
# 시크릿이 없으므로 이 파일 자체는 커밋해도 안전하다 (api_keys 만 절대 커밋 금지).

db_path: "data/tossmon.db"
log_dir: "data/logs"
state_dir: "data/ops_state"
archive_dir: "data/archive"

# collector 실행 커맨드. W4의 실제 엔트리포인트가 확정되면 이 값을 갱신한다
# (현재는 자리표시자 — tossmon/collector/main.py 가 아직 없다면 supervisor 는
# 즉시 실패하고 재시작을 반복하니, 실제 엔트리포인트 확정 후 여기를 고쳐라).
collector_cmd: ["python", "-m", "tossmon.collector.main"]

disk:
  warn_free_gb: 5.0
  critical_free_gb: 2.0

# DB 최신 행이 이보다 오래되면 경고/위험 (세션 중인지는 운영자가 docs/08 시간표로 판단)
stale_minutes_warn: 5
stale_minutes_critical: 15

log_retention_days: 14
log_max_bytes: 20000000   # 20MB — 초과 시 회전

restart:
  max_restarts_per_window: 5   # restart_window_s 안에 이 횟수 넘게 죽으면 폭주로 간주, 재시도 중단
  restart_window_s: 600
  backoff_base_s: 2.0
  backoff_cap_s: 300.0
