[project]
name = "tossmon"
version = "0.1.0"
description = "Toss Open API US small-cap runner precursor monitoring pipeline (Phase 1: no trading code)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "filelock>=3.13",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tossmon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
