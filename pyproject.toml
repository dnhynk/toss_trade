[project]
name = "tossmon"
version = "0.1.0"
description = "Toss Open API US small-cap runner precursor monitoring pipeline (Phase 1: no trading code)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "filelock>=3.13",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tossmon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # 변이 게이트 (감사5 H-2). 변이 1건마다 pytest 하위 프로세스를 하나 돌리므로
    # 기본 스위트에서는 제외한다. 실행법:  pytest -m mutation
    # 또는 사람이 직접 볼 때:              python -m tools.mutation_gate
    "mutation: look-ahead mutation gate (slow, runs pytest subprocesses)",
]
# 기본 실행에서 변이 게이트를 뺀다. 명령행에서 준 -m 이 이 값을 이기므로
# `pytest -m mutation` 은 정상 동작한다.
addopts = "-m 'not mutation'"
